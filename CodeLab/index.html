<!DOCTYPE html>

<html lang="zh-CN">

<head>

    <meta charset="UTF-8">

    <title>网页Python · Vojing Studio</title>

    <style>
:root{
  --bg:#f7f8fa; --card:#ffffff; --ink:#16181d; --ink-2:#5b6170; --ink-3:#8a8f9c;
  --line:#ececf0; --accent:#ff5a5f; --accent-d:#e8454a; --accent-soft:rgba(255,90,95,.10);
  --term-bg:#0f1115; --term-ink:#e6e6e6; --term-prompt:#4cc9ff;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  --mono:"SF Mono",Consolas,"Liberation Mono",Menlo,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font);background:var(--bg);color:var(--ink);min-height:100vh;padding:24px 16px;display:flex;flex-direction:column;align-items:center;}
.back-btn,.save-btn{
  position:fixed;top:18px;z-index:50;border:1px solid var(--line);background:#fff;cursor:pointer;
  font-size:14px;font-weight:600;border-radius:999px;padding:8px 16px;transition:.2s;
}
.back-btn{left:18px;color:var(--ink-2);}
.back-btn:hover{color:var(--ink);background:var(--bg);border-color:#d8d9e0;}
.save-btn{right:18px;color:#fff;background:var(--accent);border-color:var(--accent);}
.save-btn:hover{background:var(--accent-d);border-color:var(--accent-d);}
.terminal{
  width:100%;max-width:920px;margin-top:48px;background:var(--term-bg);border-radius:16px;
  padding:0;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(16,18,29,.18);
  height:78vh;
}
#output{
  white-space:pre-wrap;margin:0;padding:18px 20px;flex-grow:1;overflow-y:auto;
  color:var(--term-ink);font-family:var(--mono);font-size:15px;line-height:1.6;
}
.input-line{display:flex;width:100%;padding:12px 20px 18px;background:#171a21;border-top:1px solid #262b34;}
.prefix{color:var(--term-prompt);margin-right:10px;font-size:15px;font-family:var(--mono);white-space:nowrap;}
#code-input{flex:1;background:transparent;border:none;outline:none;color:var(--term-ink);font-size:15px;font-family:var(--mono);width:100%;}
#code-input:focus{background:transparent;}
.privacy-tip{position:fixed;bottom:12px;right:18px;color:var(--ink-3);font-size:12px;pointer-events:none;}
@media (max-width:600px){
  .terminal{height:82vh;margin-top:40px;}
  .back-btn,.save-btn{font-size:13px;padding:7px 12px;}
}
</style>

</head>

<body>

<!-- 左上角返回首页按钮 -->

<button class="back-btn" id="backBtn">← 返回首页</button>

<!-- 右上角另存为按钮 -->

<button class="save-btn" id="saveBtn">另存为</button>



<div class="terminal">

    <div id="output">网页Python · Vojing Studio

提示：点击蓝色>>>后方输入框输入代码回车运行

仅支持控制台代码，tkinter/pygame/turtle等图形库已拦截

>>> </div>

    <div class="input-line">

        <span class="prefix">>>></span>

        <input id="code-input" autocomplete="off">

    </div>

    <div class="privacy-tip">Vojing Studio · 尊重您的隐私，所有代码仅本地浏览器运行，不上传服务器</div>

</div>



<script src="https://cdn.jsdelivr.net/pyodide/v0.24.1/full/pyodide.js"></script>

<script>

// ====================== 页面配色&功能备注 ======================

// 蓝色箭头 >>> ：代码输入提示符，标识输入位置

// 绿色文字：代码、运行输出内容

// 使用方法：点击蓝色箭头后方输入框，写入Python代码按回车执行

// 右上角红色按钮：另存为，导出输入框代码为 .py 文件到本地电脑

// 修复：执行代码前缓存代码，清空输入框也能正常保存

// 项目归属：Vojing Studio

// 功能：在线Python纯终端运行工具

// 限制：自动拦截所有GUI、绘图类代码，仅支持控制台文本代码

// 隐私说明：所有编写的Python代码仅在本地浏览器执行，不会上传任何数据至网络，保护隐私

// ======================================================

let pyodide = null;

const output = document.getElementById("output");

const input = document.getElementById("code-input");

const saveBtn = document.getElementById("saveBtn");

// 新增代码缓存，解决清空后无法保存

let lastCode = "";



// 禁止运行的图形库关键词

const blockWords = ["tkinter", "pygame", "turtle", "PyQt", "QtGui", "PIL.ImageDraw", "matplotlib.pyplot"];



// 加载Pyodide运行环境

async function loadPy() {

    pyodide = await loadPyodide();

    writeLog("Python环境加载完成\n>>> ");

    input.focus();

}



// 输出文字到终端窗口

function writeLog(text) {

    output.innerText += text;

    output.scrollTop = output.scrollHeight;

}



// 检测代码是否包含被拦截的图形库

function checkBlock(code) {

    for(let word of blockWords){

        if(code.includes(word)) return true;

    }

    return false;

}



// 执行Python代码核心逻辑

async function runCode(code) {

    // 执行前缓存代码

    lastCode = code;

    if(checkBlock(code)){

        writeLog("错误：检测到图形界面相关代码，本终端仅支持纯控制台程序\n>>> ");

        return;

    }

    try{

        pyodide.runPython(`

import sys

from io import StringIO

sys.stdout = StringIO()

`);

        pyodide.runPython(code);

        const res = pyodide.runPython("sys.stdout.getvalue()");

        if(res) writeLog(res);

    }catch(e){

        writeLog(e.toString()+"\n");

    }

    writeLog(">>> ");

}



// 回车执行代码监听

input.addEventListener("keydown", async e=>{

    if(e.key === "Enter"){

        const code = input.value;

        writeLog(code+"\n");

        input.value = "";

        await runCode(code);

        input.focus();

    }

})



// 另存为按钮功能：读取缓存代码 + 当前输入框代码双重判断

saveBtn.addEventListener("click", ()=>{

    // 优先取输入框内容，空则取上次执行的代码

    let codeText = input.value.trim();

    if(!codeText) codeText = lastCode.trim();



    if(!codeText){

        alert("暂无代码可保存！请输入代码或运行一段代码后重试");

        return;

    }

    // 生成py文件下载

    const blob = new Blob([codeText], {type:"text/plain"});

    const url = URL.createObjectURL(blob);

    const a = document.createElement("a");

    a.href = url;

    a.download = "main.py";

    a.click();

    URL.revokeObjectURL(url);

})



// 返回首页：回到工作室主页

document.getElementById("backBtn").addEventListener("click", ()=>{

    location.href = '/';

})



loadPy();

</script>

</body>

</html>
