<!DOCTYPE html>

<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>VOJING 搜索 · Vojing 工作室</title>

<style>
:root{
  --bg:#ffffff; --bg-soft:#f7f8fa; --ink:#16181d; --ink-2:#5b6170; --ink-3:#8a8f9c;
  --line:#ececf0; --accent:#ff5a5f; --accent-d:#e8454a; --accent-soft:rgba(255,90,95,.10);
  --shadow-sm:0 4px 16px rgba(16,18,29,.06);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:var(--font);
  background:
    radial-gradient(60% 50% at 20% 0%, rgba(255,106,106,.10), transparent 60%),
    radial-gradient(50% 45% at 90% 10%, rgba(99,102,241,.08), transparent 60%),
    var(--bg);
  min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:20px 15px; position:relative; color:var(--ink);
}
.home-btn{
  position:fixed; top:20px; left:20px;
  background:#fff; border:1px solid var(--line); color:var(--ink-2);
  border-radius:999px; padding:7px 16px; font-size:14px; font-weight:600;
  cursor:pointer; z-index:100; transition:.2s; box-shadow:var(--shadow-sm);
}
.home-btn:hover{color:var(--ink); border-color:#d8d9e0; background:var(--bg-soft);}
.setting-dot{
  position:fixed; top:20px; right:20px; width:34px; height:34px;
  border:1px solid var(--line); border-radius:50%; display:flex; align-items:center; justify-content:center;
  font-size:18px; color:var(--ink-2); cursor:pointer; z-index:100; background:#fff; transition:.2s;
}
.setting-dot:hover{color:var(--accent-d); border-color:#d8d9e0;}
.engine-panel{
  position:fixed; top:62px; right:20px; background:#fff; border:1px solid var(--line);
  border-radius:12px; padding:8px; display:none; z-index:99; min-width:150px; box-shadow:0 8px 30px rgba(16,18,29,.12);
}
.engine-item{ padding:9px 12px; cursor:pointer; border-radius:8px; margin:2px 0; font-size:14px; color:var(--ink-2); }
.engine-item:hover{background:var(--bg-soft);}
.engine-item.active{background:var(--accent-soft); color:var(--accent-d); font-weight:600;}
.logo-group{ display:inline-flex; align-items:center; gap:14px; margin-bottom:34px; }
.circle-v{
  width:68px;height:68px; border:5px solid var(--accent); border-radius:50%;
  display:flex;align-items:center;justify-content:center; font-size:32px;font-weight:800;color:var(--accent);flex-shrink:0;
}
.vojing-text{font-size:34px;font-weight:800;letter-spacing:2px;color:var(--ink);}
.wrap{width:100%;max-width:600px;text-align:center;}
.search-container{ display:flex; border:1px solid var(--line); border-radius:999px; overflow:hidden; background:#fff; box-shadow:0 8px 30px rgba(16,18,29,.08); transition:.2s; }
.search-container:focus-within{border-color:var(--accent); box-shadow:0 8px 30px rgba(255,90,95,.18);}
.search-container input{ flex:1;border:none;outline:none;padding:16px 22px;font-size:16px;background:transparent;color:var(--ink); }
.search-container button{ border:none;background:var(--accent);color:#fff;padding:0 28px;font-size:16px;font-weight:600;cursor:pointer;transition:.2s; }
.search-container button:hover{background:var(--accent-d);}
@media screen and (max-width:480px){
  .circle-v{width:54px;height:54px;font-size:26px;border-width:4px;}
  .vojing-text{font-size:26px;letter-spacing:1px;}
  .search-container input{padding:14px 16px;font-size:15px;}
  .search-container button{padding:0 18px;font-size:15px;}
  .setting-dot{top:14px;right:14px;width:30px;height:30px;font-size:15px;}
  .engine-panel{top:54px;right:14px;}
  .home-btn{top:14px;left:14px;font-size:13px;padding:6px 12px;}
}
</style>

</head>

<body>

<div class="home-btn" id="homeBtn">← 返回首页</div>

<div class="setting-dot" id="dotBtn">⋮</div>

<div class="engine-panel" id="panel">

    <div class="engine-item active" data-url="https://cn.bing.com/search?q=">必应</div>

    <div class="engine-item" data-url="https://www.baidu.com/s?wd=">百度</div>

    <div class="engine-item" data-url="https://www.so.com/s?q=">360搜索</div>

    <div class="engine-item" data-url="https://search.mozilla.org/firefox?q=">火狐搜索</div>

    <div class="engine-item" data-url="https://quark.sm.cn/s?q=">夸克搜索</div>

</div>



<div class="logo-group">

    <div class="circle-v">V</div>

    <div class="vojing-text">VOJING</div>

</div>



<div class="wrap">

    <form id="searchForm" target="_blank">

        <input type="hidden" id="baseUrl" value="https://cn.bing.com/search?q=">

        <div class="search-container">

            <input type="text" name="q" placeholder="输入搜索内容" required>

            <button type="submit">搜索</button>

        </div>

    </form>

</div>



<script>

const dotBtn = document.getElementById('dotBtn');

const panel = document.getElementById('panel');

const baseUrlInput = document.getElementById('baseUrl');

const items = document.querySelectorAll('.engine-item');

const form = document.getElementById('searchForm');

const homeBtn = document.getElementById('homeBtn');



homeBtn.onclick = ()=> location.href = '/';



dotBtn.onclick = (e)=>{

    e.stopPropagation();

    panel.style.display = panel.style.display === 'block' ? 'none' : 'block';

}

document.body.onclick = ()=> panel.style.display = 'none';



items.forEach(item=>{

    item.onclick = ()=>{

        items.forEach(i=>i.classList.remove('active'));

        item.classList.add('active');

        baseUrlInput.value = item.dataset.url;

        panel.style.display = 'none';

    }

})



form.onsubmit = function(){

    const kw = this.q.value.trim();

    window.open(baseUrlInput.value + encodeURIComponent(kw));

    return false;

}

</script>

</body>

</html>
