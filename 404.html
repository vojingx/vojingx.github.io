<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 错误</title>
<style>
:root{
  --bg:#f7f8fa; --card:#ffffff; --ink:#16181d; --ink-2:#5b6170; --ink-3:#8a8f9c;
  --line:#ececf0; --accent:#ff5a5f; --accent-d:#e8454a; --accent-soft:rgba(255,90,95,.10);
  --radius:20px; --shadow:0 8px 30px rgba(16,18,29,.10);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:var(--font);
  background:
    radial-gradient(60% 50% at 15% 0%, rgba(255,90,95,.08), transparent 60%),
    radial-gradient(50% 45% at 90% 10%, rgba(99,102,241,.08), transparent 60%),
    var(--bg);
  color:var(--ink);
  min-height:100vh;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:24px; text-align:center;
  -webkit-font-smoothing:antialiased;
}
.error-box{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:52px 56px;
  box-shadow:var(--shadow);
  max-width:440px; width:100%;
  position:relative; overflow:hidden;
}
.error-box::before{
  content:""; position:absolute; inset:0 0 auto 0; height:6px;
  background:linear-gradient(90deg,#ff6a6a,#ff4d8d);
}
h1{
  font-size:88px; font-weight:800; letter-spacing:-.04em; line-height:1;
  background:linear-gradient(180deg,#16181d,#3a3f4b);
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
.tips{font-size:17px; color:var(--ink-2); margin:14px 0 36px;}
.back-btn{
  display:inline-block;
  text-decoration:none;
  padding:13px 34px;
  background:var(--accent); color:#fff;
  border-radius:999px; font-size:15px; font-weight:600;
  box-shadow:0 8px 22px rgba(255,90,95,.32);
  transition:transform .15s ease, background .2s ease, box-shadow .2s ease;
}
.back-btn:hover{background:var(--accent-d); transform:translateY(-2px); box-shadow:0 12px 28px rgba(255,90,95,.4);}
.foot{margin-top:26px; font-size:13px; color:var(--ink-3);}
</style>
</head>
<body>
<div class="error-box">
  <h1>404</h1>
  <p class="tips">哎呀，这个页面走丢了</p>
  <a href="./index.html" class="back-btn">返回首页</a>
</div>
<p class="foot">Vojing 工作室 · 简洁实用的 PC 工具</p>
</body>
</html>
